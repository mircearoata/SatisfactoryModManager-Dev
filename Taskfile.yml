# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: 3

tasks:
  build:
    silent: true
    vars:
      OUTPUT_FULL_PATH: '{{ $args := (splitArgs .CLI_ARGS) }}{{ range $i, $a := $args }}{{ if eq $a "-o" }}{{ index $args (add $i 1) }}{{ end }}{{ end }}'
      OUTPUT_FILENAME: '{{ if ne .OUTPUT_FULL_PATH "" }}{{ base (toSlash .OUTPUT_FULL_PATH) }}{{ end }}'
      WAILS_ARGS: '
        {{ $rawArgs := (splitArgs .CLI_ARGS) }}
        {{ $args := without $rawArgs "." "-o" .OUTPUT_FULL_PATH }}
        {{ $GOOS := (env "GOOS") }}
        {{ $GOARCH := (env "GOARCH") }}
        {{ range $args }}
        {{ shellQuote . }}
        {{ end }}
        {{ if ne $GOOS "" }}-platform {{ $GOOS }}{{ if ne $GOARCH "" }}/{{ $GOARCH }}{{ end }}{{ end }}
        {{ if ne .OUTPUT_FILENAME "" }}-o {{ .OUTPUT_FILENAME }}{{ end }}
      '
    cmds:
      - GOOS="" GOARCH="" wails build {{.WAILS_ARGS}}
      - platforms:
          - darwin
        cmd: |
          {{ if ne .OUTPUT_FILENAME "" }}
            pushd "build/bin" || exit 1
            codesign --force --deep -s - "{{.OUTPUT_FILENAME}}.app" # If a universal binary is generated, the signature is lost
            zip -r "{{.OUTPUT_FILENAME}}.zip" "{{.OUTPUT_FILENAME}}.app" # zip would add the .zip extension anyway
            mv "{{.OUTPUT_FILENAME}}.zip" "{{.OUTPUT_FILENAME}}"
            popd || exit 1
          {{ end }}
      - cmd: |
          {{ if ne .OUTPUT_FILENAME "" }}
            mkdir -p "{{ osDir .OUTPUT_FULL_PATH }}"
            cp -r "build/bin/{{.OUTPUT_FILENAME}}" "{{.OUTPUT_FULL_PATH}}"
          {{ end }}

  build:linux:appimage:
    silent: true
    platforms: [linux]
    vars:
      OUTPUT_FULL_PATH: '{{ $args := (splitArgs .CLI_ARGS) }}{{ range $i, $a := $args }}{{ if eq $a "-o" }}{{ index $args (add $i 1) }}{{ end }}{{ end }}'
      OUTPUT_FILENAME: '{{ if ne .OUTPUT_FULL_PATH "" }}{{ base (toSlash .OUTPUT_FULL_PATH) }}{{ end }}'
      WAILS_ARGS: '
        {{ $rawArgs := (splitArgs .CLI_ARGS) }}
        {{ $args := without $rawArgs "." "-o" .OUTPUT_FULL_PATH }}
        {{ $GOOS := (env "GOOS") }}
        {{ $GOARCH := (env "GOARCH") }}
        {{ range $args }}
        {{ shellQuote . }}
        {{ end }}
        {{ if ne $GOOS "" }}-platform {{ $GOOS }}{{ if ne $GOARCH "" }}/{{ $GOARCH }}{{ end }}{{ end }}
        {{ if ne .OUTPUT_FILENAME "" }}-o {{ .OUTPUT_FILENAME }}{{ end }}
      '
    cmds:
      - GOOS="" GOARCH="" wails build {{.WAILS_ARGS}}
      - chmod +x "build/bin/{{.OUTPUT_FILENAME}}"
      - mv "build/bin/{{.OUTPUT_FILENAME}}" "build/bin/appimage-bin-tmp"
      - chmod +x "build/linux/appimage.sh" # Make sure the script is executable
      - build/linux/appimage.sh "build/bin/appimage-bin-tmp" "{{.OUTPUT_FULL_PATH}}"
      - rm "build/bin/appimage-bin-tmp"

  lint:
    silent: true
    preconditions:
      - golangci-lint --version | grep -q 2.6
    cmds:
      - GOOS=windows  golangci-lint run
      - GOOS=linux    golangci-lint run
      - GOOS=darwin   golangci-lint run
  
  prepare-release:
    vars:
      RAW_VERSION: '{{with or .CLI_ARGS .VERSION}}{{trimPrefix "v" .}}{{end}}'
      V_VERSION: 'v{{.RAW_VERSION}}'
    preconditions:
      - sh: '[ "$(git branch --show-current)" = "master" ]'
        msg: "Must be on master branch"
      - sh: '[ "$(git status --porcelain)" = "" ]'
        msg: "Working directory must be clean"
      - sh: '[ "$(git rev-list --count HEAD..@{u})" -eq 0 ]'
        msg: "Local branch is behind remote. Please pull the latest changes."
      - sh: '! git show-ref --exists refs/tags/{{.V_VERSION}}'
        msg: "Tag {{.V_VERSION}} already exists"
      - sh: '[ -n "{{.RAW_VERSION}}" ]'
        msg: "Version required. Usage: task prepare-release VERSION=<version>"
      - sh: 'which jq'
        msg: "jq is required to run this task"
    cmds:
      - pnpm -C frontend translations
      - |
        if ! git diff --exit-code; then
          git add frontend/src/lib/localization/locales
          git commit -m "Update translations"
        fi
      - jq '.info.productVersion = "{{.RAW_VERSION}}"' wails.json > wails.json.tmp && mv wails.json.tmp wails.json
      - git add wails.json
      - git commit -m "Bump version"

      - git tag {{.V_VERSION}}
      - echo 'Release {{.V_VERSION}} prepared. Run "git push" and "git push origin tag {{.V_VERSION}}" to create the release.'
